[pytest]
# ─── Test Discovery ────────────────────────────────────────────────────────────
testpaths        = tests
python_files     = test_*.py
python_classes   = Test*
python_functions = test_*

# ─── BDD ──────────────────────────────────────────────────────────────────────
bdd_features_base_dir = features

# ─── Markers ──────────────────────────────────────────────────────────────────
markers =
    sanity:          Core flows alive
    smoke:           Pre-release smoke suite
    regression:      Full regression suite
    e2e:             End-to-end user journey
    negative:        Error-path test cases
    ui:              Selenium browser tests
    api:             REST API tests
    auth:            Authentication tests
    content:         Content catalogue tests
    search:          Search and filter tests
    player:          Video player tests
    subscription:    Subscription and payment tests
    watchlist:       Watchlist tests
    profile:         User profile tests
    # ── BDD scenario IDs ────────────────────────────────────────────────────
    BDD_E2E_001:     Search content and verify API + play back on UI
    BDD_E2E_002:     Unauthenticated user blocked from premium content
    BDD_E2E_003:     Login, search, add to watchlist, verify API persists
    BDD_AUTH_001:    Login with valid credentials via UI
    BDD_AUTH_002:    Login with invalid credentials shows error
    BDD_AUTH_003:    Logout clears session
    BDD_API_AUTH_001: API login returns 200 with token
    BDD_API_AUTH_002: API login returns 401 for wrong password
    BDD_API_CNT_001: GET /content returns results array
    BDD_E2E_004:    Parametrised UI search finds expected content
    BDD_SRCH_001:   Valid keyword returns search results
    BDD_SRCH_002:   Unknown keyword shows no-results message
    BDD_SRCH_003:   All result titles are relevant to the keyword
    BDD_SRCH_004:   Clicking first result opens content detail page
    BDD_SRCH_005:   Clearing search input resets results
    BDD_SRCH_006:   Special characters do not crash the page
    BDD_SRCH_007:   Single character search is stable
    BDD_SRCH_008:   Parametrised search finds results for valid keywords

# ─── CLI defaults ─────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
    --reruns=1
    --reruns-delay=2

# ─── Logging ──────────────────────────────────────────────────────────────────
log_cli         = true
log_cli_level   = INFO
log_format      = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_file        = logs/pytest.log
log_file_level  = DEBUG
