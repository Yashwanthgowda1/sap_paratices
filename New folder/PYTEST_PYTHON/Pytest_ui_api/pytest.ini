[pytest]
# ─── Test Discovery ───────────────────────────────────────────────────────────
testpaths        = tests
python_files     = test_*.py
python_classes   = Test*
python_functions = test_*

# ─── Markers ──────────────────────────────────────────────────────────────────
markers =
    sanity:       Quick sanity tests verifying core flows are alive
    smoke:        Broader smoke suite run before every release
    regression:   Full regression suite covering all features
    e2e:          End-to-end user journey tests
    negative:     Negative / error-path test cases
    ui:           Selenium browser tests
    api:          REST API tests
    auth:         Authentication and authorisation
    content:      Content catalogue and home page
    search:       Search feature
    player:       Video player
    subscription: Subscription and payment
    watchlist:    Watchlist / favourites
    profile:      User profile and settings
    # ── UI TC IDs ──────────────────────────────────────────────────────────────
    TC_AUTH_001:  Login with valid email and password
    TC_AUTH_002:  Login with invalid password
    TC_AUTH_003:  Login with unregistered email
    TC_AUTH_004:  Login with empty email field
    TC_AUTH_005:  Forgot password link navigates to reset page
    TC_AUTH_006:  Sign Up link visible on login page
    TC_AUTH_007:  Login modal can be closed
    TC_AUTH_008:  Logout successfully
    TC_AUTH_009:  Login and home page loads with content trays
    TC_AUTH_010:  Login with invalid email format
    TC_HOME_001:  Home page loads with logo and hero banner
    TC_HOME_002:  All nav items present
    TC_HOME_003:  Hero banner has play button
    TC_HOME_004:  Home page shows multiple content trays
    TC_HOME_005:  Movies nav navigates to movies catalogue
    TC_HOME_006:  Sports nav navigates to sports section
    TC_HOME_007:  Search icon on home page is clickable
    TC_HOME_008:  Continue Watching section for logged-in user
    TC_SRCH_001:  Search returns results for valid keyword
    TC_SRCH_002:  Search shows no-results for unknown keyword
    TC_SRCH_003:  Search result titles are relevant
    TC_SRCH_004:  Trending searches shown on empty search
    TC_SRCH_005:  Click first search result opens content detail
    TC_SRCH_006:  Clear button resets search results
    TC_SRCH_007:  Parametrised search for each valid keyword
    TC_SRCH_008:  Search with special characters does not crash
    TC_SRCH_009:  Search is case-insensitive
    TC_SRCH_010:  Single character search stable
    TC_PLYR_001:  Player loads for free content
    TC_PLYR_002:  Premium content shows Subscribe CTA
    TC_PLYR_003:  Play/Pause toggles playback state
    TC_PLYR_004:  Fullscreen button enters fullscreen
    TC_PLYR_005:  Forward 10s skips playback forward
    TC_PLYR_006:  All player controls are visible
    TC_PLYR_007:  Volume button mutes audio
    TC_PLYR_008:  Settings gear opens quality/subtitle options
    TC_PLYR_009:  No player error on valid content
    TC_PLYR_010:  User can exit player
    TC_SUB_001:   Subscription plans page loads
    TC_SUB_002:   All plans display a price
    TC_SUB_003:   Coupon code field accepts input
    TC_SUB_004:   Invalid coupon shows error
    TC_SUB_005:   Annual billing toggle changes pricing
    TC_SUB_006:   Payment options visible
    TC_SUB_007:   Active plan badge for subscribed user
    TC_SUB_008:   Subscribe CTA navigates to plans page
    TC_WL_001:    Add content to watchlist
    TC_WL_002:    Remove content from watchlist
    TC_WL_003:    Added content appears on watchlist page
    TC_WL_004:    Empty watchlist shows browse message
    TC_WL_005:    Watchlist requires login
    TC_WL_006:    Watchlist count increases after adding
    TC_WL_007:    Remove item from watchlist page
    TC_WL_008:    End-to-end watchlist journey
    TC_PROF_001:  Profile dropdown opens on avatar click
    TC_PROF_002:  Profile name visible after login
    TC_PROF_003:  Account settings page opens
    TC_PROF_004:  User can update display name
    TC_PROF_005:  My Subscription link navigates to plans
    TC_PROF_006:  Logout from profile menu
    TC_PROF_007:  Login state persists across pages
    # ── API TC IDs ─────────────────────────────────────────────────────────────
    TC_API_AUTH_001:  POST /auth/login returns 200 with token
    TC_API_AUTH_002:  POST /auth/login returns 401 for invalid password
    TC_API_AUTH_003:  POST /auth/login returns 400 for missing email
    TC_API_AUTH_004:  POST /auth/refresh returns new token
    TC_API_AUTH_005:  POST /auth/logout invalidates session
    TC_API_AUTH_006:  GET /user/profile returns 401 without token
    TC_API_AUTH_007:  POST /auth/login returns 400 for empty password
    TC_API_AUTH_008:  POST /auth/login responds within 3 seconds
    TC_API_CNT_001:   GET /content returns 200 with items array
    TC_API_CNT_002:   GET /content/{id} returns content details
    TC_API_CNT_003:   GET /content/{id} returns 404 for unknown ID
    TC_API_CNT_004:   GET /search returns relevant results
    TC_API_CNT_005:   Content filter by genre
    TC_API_CNT_006:   Content filter by language
    TC_API_CNT_007:   Content pagination with page and limit
    TC_API_CNT_008:   Search with empty query returns 400
    TC_API_CNT_009:   Parametrised search returns results for each keyword
    TC_API_CNT_010:   GET /content responds within 2 seconds
    TC_API_WL_001:    GET /user/watchlist returns 200 for auth user
    TC_API_WL_002:    GET /user/watchlist returns 401 without token
    TC_API_WL_003:    POST /user/watchlist adds content
    TC_API_WL_004:    DELETE /user/watchlist/{id} removes item
    TC_API_WL_005:    Adding duplicate item returns 409 or is idempotent
    TC_API_WL_006:    DELETE non-existent item returns 404
    TC_API_WL_007:    Item appears in list after adding
    TC_API_WL_008:    Watchlist count updates after add and delete
    TC_API_SUB_001:   GET /subscription/plans returns 200 with plans
    TC_API_SUB_002:   All plans contain id name and price
    TC_API_SUB_003:   POST /subscription/validate-coupon valid coupon
    TC_API_SUB_004:   POST /subscription/validate-coupon invalid coupon
    TC_API_SUB_005:   GET /user/subscription returns subscription info
    TC_API_SUB_006:   GET /user/subscription returns 401 without token
    TC_API_SUB_007:   GET /subscription/plans responds within 2 seconds
    TC_API_SUB_008:   GET /subscription/plans returns plans for IN region

# ─── Default addopts ─────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=reports/allure-results
    --reruns=1
    --reruns-delay=2

# ─── Logging ─────────────────────────────────────────────────────────────────
log_cli          = true
log_cli_level    = INFO
log_format       = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format  = %Y-%m-%d %H:%M:%S
log_file         = logs/pytest.log
log_file_level   = DEBUG
