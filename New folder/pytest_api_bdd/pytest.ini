[pytest]
# ── Where pytest looks for tests ─────────────────────────────────────────────
testpaths = tests

# ── Test file / class / function naming pattern ───────────────────────────────
python_files   = test_*.py
python_classes = Test*
python_functions = test_*

# ── Output ────────────────────────────────────────────────────────────────────
# -v  : verbose (show each test name)
# -s  : show print/log output live (don't capture)
# --tb=short : short traceback on failure
addopts = -v -s --tb=short

# ── Markers — declare custom markers to avoid warnings ───────────────────────
markers =
    smoke:      fast, critical-path tests run on every commit
    regression: full regression suite
    slow:       tests that take > 5 s (skip with -m "not slow")
