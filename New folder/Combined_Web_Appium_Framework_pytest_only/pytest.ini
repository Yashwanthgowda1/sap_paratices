[pytest]
# ── Test discovery ─────────────────────────────────────────────────────────
testpaths    = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Allure reporting ────────────────────────────────────────────────────────
addopts =
    --alluredir=reports/allure-results
    -v
    --tb=short

# ── Custom markers ──────────────────────────────────────────────────────────
# Run specific group: pytest -m smoke
# Run web only:       pytest -m web
# Run mobile only:    pytest -m mobile
markers =
    smoke:      Fast sanity check tests (run on every deployment)
    regression: Full regression suite
    web:        Web browser tests only
    mobile:     Android mobile tests only
    login:      Login-related tests
    search:     Search-related tests
    critical:   P0 critical path tests

# ── Logging ─────────────────────────────────────────────────────────────────
log_cli       = true
log_cli_level = INFO
log_format    = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %H:%M:%S
