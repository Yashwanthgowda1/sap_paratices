# tasks file for roles/common
---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required base packages
  apt:
    name:
      - curl
      - wget
      - git
      - vim
      - net-tools
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - python3-pip
    state: present

