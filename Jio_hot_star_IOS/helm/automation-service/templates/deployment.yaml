apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    env: {{ .Values.env.TEST_ENV }}
    version: {{ .Values.image.tag }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}      # selector must match pod label
      env: {{ .Values.env.TEST_ENV }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}    # pod label — matched by selector + service
        env: {{ .Values.env.TEST_ENV }}
        version: {{ .Values.image.tag }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: automation
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: TEST_ENV
              value: {{ .Values.env.TEST_ENV | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: shm
              mountPath: /dev/shm       # chrome needs shared memory
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "run_tests.sh"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shm_size }}
